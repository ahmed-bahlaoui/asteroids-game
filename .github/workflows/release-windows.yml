name: windows-release

on:
  push:
    tags:
      - "v*"          # git tag v0.1.0 && git push origin v0.1.0
  workflow_dispatch:  # manual Run workflow button
    inputs:
      release_tag:
        description: "Tag name to use for the release (example: v0.1.1)"
        required: true

permissions:
  contents: write   # required to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build exe
        run: |
          uv run pyinstaller --clean --noconfirm --onedir --windowed --name Asteroids `
            --add-data "assets;assets" `
            --add-data "fonts;fonts" `
            main.py

      - name: Zip bundle
        run: Compress-Archive -Path dist/Asteroids/* -DestinationPath Asteroids-windows.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: Asteroids-windows.zip
          generate_release_notes: true